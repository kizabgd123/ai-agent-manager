[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-agent-manager"
version = "0.1.0"
description = "Mood-based music recommendation system with AnythingLLM integration"
requires-python = ">=3.11"
dependencies = [
    "textblob>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "vercel>=3.0",
]
